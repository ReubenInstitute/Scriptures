[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-scriptures"
version = "0.31"
description = "Hebrew scripture text classes (Bible, Mishnah, Talmud, Zohar)."
readme = { text = "Hebrew scripture text classes (Bible, Mishnah, Talmud, Zohar).", content-type = "text/plain" }
license = "GPL-3.0-or-later"
license-files = ["GPL-3"]
requires-python = ">=3.8"
dependencies = [
    "python-hebrew",
]

[tool.setuptools]
packages = ["scriptures"]

[tool.setuptools.package-data]
scriptures = ["json/*.json", "csv/*.csv"]
