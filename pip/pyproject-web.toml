[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptures-web"
version = "0.31"
description = "Web viewer for scripture corpus"
readme = { text = "Flask app serving the Hebrew scripture texts in the browser.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
license-files = ["GPL-3"]
requires-python = ">=3.8"
dependencies = [
    "hebrew-scriptures",
    "flask",
    "common-fonts",
    "reubeninstitute-css",
]

[tool.setuptools]
py-modules = ["scriptures-web"]
