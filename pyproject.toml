[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Scriptures"
version = "0.29"
description = "Hebrew scripture text classes (Bible, Mishnah, Talmud, Zohar) for Reuben Institute's Hebrew text corpus, with a bundled web viewer available separately"
readme = { text = "Hebrew scripture text classes (Bible, Mishnah, Talmud, Zohar) for Reuben Institute's Hebrew text corpus, with a bundled web viewer available separately.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
license-files = ["GPL-3"]
requires-python = ">=3.8"
dependencies = [
    "Hebrew",
    "pandas",
]

[tool.setuptools]
py-modules = ["Scriptures", "Bible", "Mishnah", "TalmudBavli", "TalmudYerushalmi", "Zohar", "ZoharChadash", "ZoharTikkunim"]
